services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8003:8003"
    volumes:
      - teamflow-runtime:/app/runtime

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5175:80"

volumes:
  teamflow-runtime:
